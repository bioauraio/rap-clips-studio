# rap-clips-studio — личный проект, файлы и деплой полностью изолированы от
# /opt/bioaura-organism. Наружу порт не публикуется: локальный nginx
# проксирует 127.0.0.1:8930 → clips.resetaura.io.
#
# Сеть organism_net — ЕДИНСТВЕННАЯ связь с организмом: это внешняя docker-сеть
# bioaura-organism (172.18.0.0/16), к ней привязан ufw-допуск на agent-gateway
# (Claude по подписке, порт 8765). Без неё контейнер не в разрешённой подсети
# и шлюз недоступен даже теоретически — свой брандмауэр не трогаем.
services:
  rapclips:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: rapclips-api
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_GATEWAY_URL: http://172.18.0.1:8765
      IMAGE_GATEWAY_URL: http://172.18.0.1:8766
      GROK_GATEWAY_URL: http://172.18.0.1:8767
      # Хостовый эквивалент bind-mount'а ./data ниже — Grok (процесс на хосте,
      # не в докере) должен уметь ОТКРЫТЬ файл картинки по реальному пути.
      HOST_DATA_DIR: /opt/rapclips/data
      ORGANISM_UPLOADS_DIR: /organism-uploads
      # Мост внешнего выхода организма для платных текстовых моделей:
      # напрямую с этого адреса api.anthropic.com отвечает 403.
      # Значение можно переопределить в infra/.env.
      EGRESS_PROXY: ${EGRESS_PROXY:-socks5://172.18.0.1:1081}
      # Файлы стилей из админки — в том, а не в образе.
      STYLE_ASSETS_DIR: /data/styles
      # ─────────────────────── место на диске ───────────────────────
      # У машины общий раздел с ЧУЖИМИ проектами, поэтому расход диска —
      # первоклассное ограничение, а не примечание. Значения перекрываются
      # в infra/.env без правки этого файла.
      #   FRAME_FORMAT=png    вернёт прежнее хранение кадров целиком;
      #   FRAMES_CONVERT=0    выключит разовую конверсию старых PNG.
      FRAME_FORMAT: ${FRAME_FORMAT:-webp}
      FRAMES_CONVERT: ${FRAMES_CONVERT:-1}
      CLIP_CRF: ${CLIP_CRF:-20}
      CLIP_MAXRATE: ${CLIP_MAXRATE:-12M}
      CLIP_KEEP_DAYS: ${CLIP_KEEP_DAYS:-14}
      DISK_MIN_FREE_PCT: ${DISK_MIN_FREE_PCT:-10}
      # Тяжёлый ffmpeg строго по одному: два параллельных апскейла 4К на
      # коробке с 3.8 ГБ И БЕЗ СВОПА — это сценарий, где OOM-killer убивает
      # не нас, а соседнюю базу.
      FFMPEG_SLOTS: ${FFMPEG_SLOTS:-1}
    # ЛИМИТ ПАМЯТИ. До него его не было ни у одного контейнера на машине:
    # любой всплеск нашего ffmpeg бил по соседям (podsoznanie-dver, rod,
    # family-postgres живут здесь же). memswap = memory, потому что свопа на
    # хосте нет вовсе, и «дать своп» тут не вариант, а иллюзия.
    mem_limit: ${API_MEM_LIMIT:-1500m}
    memswap_limit: ${API_MEM_LIMIT:-1500m}
    ports:
      - "127.0.0.1:8930:8000"
    volumes:
      # Bind-mount АБСОЛЮТНЫМ путём (не именованный volume, не относительный!) —
      # должен буква-в-букву совпадать с HOST_DATA_DIR: тот путь читает Grok,
      # процесс на хосте, а не внутри этого контейнера.
      - /opt/rapclips/data:/data
      # ТОЛЬКО чтобы забрать готовое видео и тут же стереть его оттуда —
      # Grok физически пишет mp4 в общий каталог организма (см. mediagen.py).
      # Ничего своего сюда не пишем и не читаем, кроме этой очистки.
      - /opt/bioaura-organism/matrix/data/uploads:/organism-uploads
    networks:
      - default
      - organism_net

networks:
  organism_net:
    external: true
    name: bioaura-organism_default
