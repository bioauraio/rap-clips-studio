# clips.resetaura.io — rap-clips-studio, ЛИЧНЫЙ проект, вне организма.
# Файл лежит напрямую в /etc/nginx/sites-enabled (не симлинк на git-репозиторий
# организма), поэтому деплой /opt/bioaura-organism его не трогает и не затирает.
server {
    server_name clips.resetaura.io;

    client_max_body_size 200m;   # аудиодорожки
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8930;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/clips.resetaura.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/clips.resetaura.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = clips.resetaura.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name clips.resetaura.io;
    return 404; # managed by Certbot
}
