<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="токен lolq.ai">
  <defs>
    <linearGradient id="tk-face" x1="8%" y1="4%" x2="92%" y2="96%">
      <stop offset="0" stop-color="#f2a04a"/>
      <stop offset="45%" stop-color="#ea6a34"/>
      <stop offset="1" stop-color="#e0503a"/>
    </linearGradient>
    <linearGradient id="tk-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0" stop-color="#ffc772"/>
      <stop offset="1" stop-color="#d9631a"/>
    </linearGradient>
  </defs>

  <!-- рант монеты: тонкая тёплая кромка под чернильной обводкой -->
  <circle cx="64" cy="66" r="52" fill="#2d211a"/>
  <circle cx="64" cy="63" r="52" fill="url(#tk-rim)" stroke="#2d211a" stroke-width="7"/>
  <circle cx="64" cy="63" r="43" fill="url(#tk-face)" stroke="#2d211a" stroke-width="5"/>

  <!-- знак марки: то же открытое «Q» с хвостом-курсором, что и в логотипе -->
  <path d="M74 44 H80 A15 15 0 0 1 95 59 V72 A15 15 0 0 1 80 87 H50
           A15 15 0 0 1 35 72 V59 A15 15 0 0 1 50 44 H56"
        fill="none" stroke="#fbf7ef" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 78 L72 100 L78 94 L83 103 L89 100 L84 91 L93 90 Z"
        fill="#fbf7ef" stroke="#2d211a" stroke-width="4"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- блик: монета читается объёмной, а не плоским кругом -->
  <path d="M30 44 A43 43 0 0 1 64 22" fill="none" stroke="#fff"
        stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
</svg>
