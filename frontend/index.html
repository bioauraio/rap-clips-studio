<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>RAP CLIPS STUDIO</title>
<link rel="stylesheet" href="/style.css?v=19" />
</head>
<body>
<div id="login" class="login-screen hidden">
  <form id="login-form" class="login-box">
    <h1>rap·clips·studio</h1>
    <input id="login-password" type="password" placeholder="пароль" autofocus />
    <button type="submit">войти</button>
    <p id="login-error" class="error hidden"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <select id="project-select" class="project-select"></select>
    <label id="project-cover" class="cover-slot project-cover" title="обложка проекта — клик, чтобы заменить">
      <input id="project-cover-input" type="file" class="hidden" accept="image/jpeg,image/png,image/webp" />
      <img id="project-cover-img" class="hidden" alt="" />
      <span class="cover-ph">♪</span>
    </label>
    <input id="project-name" class="project-name" placeholder="название клипа" />
    <span id="project-kind" class="kind-badge"></span>
    <button id="new-project-btn">+ проект</button>
    <button id="logout-btn" class="ghost">выйти</button>
  </header>

  <section class="panel">
    <h2>Герой и сюжет</h2>
    <label>Библия героя (внешность, характер — одна на все треки)</label>
    <textarea id="character-bible" rows="4" placeholder="Оставь пустым — Claude придумает героя сам по первым трекам"></textarea>

    <label>Сквозной сюжет</label>
    <textarea id="story" rows="8" placeholder="Появится после генерации"></textarea>

    <div class="row">
      <button id="save-project-btn">Сохранить</button>
      <button id="gen-story-btn" class="primary">Сгенерировать сюжет по всем трекам</button>
      <span id="story-status" class="status"></span>
    </div>
  </section>

  <section class="panel">
    <h2>Персонажи альбома</h2>
    <p class="muted" style="margin:0 0 10px">Имя + характер + фото-модельки. Распространяются на весь альбом:
      в промптах кадров пишутся имена, внешность подтягивается всегда, меняется только стилистика под трек.</p>
    <div id="characters"></div>
    <div class="row">
      <button id="add-character-btn">+ добавить персонажа</button>
    </div>
  </section>

  <section class="panel">
    <h2>Треки (перетаскивай порядком мыслей — вверх/вниз)</h2>
    <div id="tracks"></div>
    <details class="add-track">
      <summary>+ добавить трек</summary>
      <form id="add-track-form" class="track-form">
        <input name="title" placeholder="Название трека" required />
        <label>Стиль клипа</label>
        <div class="style-picker"></div>
        <input type="hidden" name="style" />
        <textarea name="lyrics" placeholder="Текст песни (необязательно — можно без текста, чисто бит: тогда идею закладывают комментарий и персонажи)" rows="6"></textarea>
        <textarea name="comment" placeholder="Комментарий: что имел в виду, контекст" rows="3"></textarea>
        <input name="audio" type="file" accept="audio/*" />
        <button type="submit" class="primary">Добавить трек</button>
      </form>
    </details>
  </section>
</div>

<template id="track-tpl">
  <div class="track-card">
    <div class="track-head">
      <label class="cover-slot track-cover" title="обложка трека — клик, чтобы заменить">
        <input type="file" class="t-cover-input hidden" accept="image/jpeg,image/png,image/webp" />
        <img class="t-cover-img hidden" alt="" />
        <span class="cover-ph">♪</span>
      </label>
      <span class="pos"></span>
      <input class="t-title" placeholder="Название" />
      <div class="order-btns">
        <button class="up ghost" title="выше">↑</button>
        <button class="down ghost" title="ниже">↓</button>
        <button class="del ghost danger" title="удалить">✕</button>
      </div>
    </div>
    <div class="track-body">
      <div class="track-left">
        <label>Стиль клипа</label>
        <div class="t-style-picker style-picker"></div>
        <input type="hidden" class="t-style" />
        <label>Аудио</label>
        <audio class="t-audio" controls></audio>
        <span class="t-duration"></span>
        <label>Комментарий</label>
        <textarea class="t-comment" rows="3"></textarea>
      </div>
      <div class="track-right">
        <label>Текст песни (необязательно — можно чисто бит)</label>
        <textarea class="t-lyrics" rows="8" placeholder="Пусто = чисто бит: идею раскадровки закладывают комментарий и персонажи"></textarea>
      </div>
    </div>
    <div class="row">
      <button class="save-track">Сохранить трек</button>
      <button class="gen-scenes primary">Сгенерировать раскадровку</button>
      <span class="scenes-status status"></span>
    </div>
    <div class="row supergen-row">
      <button class="s-supergen primary">⚡ Супергенерация</button>
      <span class="supergen-note status"></span>
    </div>

    <div class="storyboard-block">
      <div class="media-head">
        <span>Лист раскадровки — весь клип одной картинкой</span>
        <span class="sb-status status"></span>
      </div>
      <div class="storyboard-box">
        <img class="sb-preview hidden" />
      </div>
      <div class="row">
        <button class="gen-storyboard">Сгенерировать лист раскадровки</button>
      </div>
    </div>

    <div class="scenes"></div>
    <div class="row">
      <button class="add-scene">+ добавить кадр вручную</button>
      <button class="gen-all-frames primary">Сгенерировать кадры всех сцен</button>
      <span class="all-frames-note muted"></span>
    </div>

    <div class="clip-block">
      <div class="media-head">
        <span class="clip-title">Готовый клип трека</span>
        <span class="clip-status status"></span>
      </div>
      <div class="media-box clip-box">
        <video class="clip-preview hidden" controls></video>
      </div>
      <div class="row">
        <button class="assemble primary">Собрать клип из утверждённых сцен</button>
        <a class="clip-download ghost hidden" download>скачать</a>
      </div>
    </div>
  </div>
</template>

<template id="char-tpl">
  <div class="char-card">
    <div class="char-head">
      <input class="c-name" placeholder="Имя персонажа" />
      <label class="approve-check c-main-label"><input type="checkbox" class="c-main" /> главный</label>
      <button class="c-del ghost danger" title="удалить">✕</button>
    </div>
    <label>Характер и внешность (пойдёт в промпты дословно)</label>
    <textarea class="c-desc" rows="3"></textarea>
    <div class="row">
      <button class="c-save">Сохранить</button>
      <label class="c-upload-label">
        <input type="file" class="c-photo-input hidden" accept="image/*" multiple />
        <span class="c-upload-btn">+ фото-моделька</span>
      </label>
      <div class="char-photos"></div>
    </div>
    <div class="char-attrs-block">
      <div class="attrs-head">
        <span class="attrs-title">Атрибуты — фирменные вещи (шляпа, очки, квадрик…)</span>
        <button type="button" class="attr-add">+ атрибут</button>
      </div>
      <div class="char-attrs"></div>
    </div>
  </div>
</template>

<template id="scene-tpl">
  <div class="scene-card">
    <div class="scene-head">
      <button class="s-play ghost" title="прослушать этот кадр">▶</button>
      <span class="s-pos"></span>
      <span class="s-time"></span>
      <input class="s-duration" type="number" min="2" max="12" title="секунд" />
      <button class="s-del ghost danger" title="удалить кадр">✕</button>
    </div>
    <div class="shot-row">
      <select class="s-shotsize">
        <option value="">крупность —</option>
        <option value="extreme close-up">деталь (extreme close-up)</option>
        <option value="close-up">крупный (close-up)</option>
        <option value="medium">средний (medium)</option>
        <option value="wide">общий (wide)</option>
        <option value="establishing">заявочный (establishing)</option>
      </select>
      <input class="s-camera" placeholder="движение камеры, напр. slow push-in" />
    </div>
    <label>Персонажи в кадре (имена через запятую — модельки подтянутся сами)</label>
    <input class="s-chars" placeholder="напр. Артём, Тень" />
    <label>Строка / момент лирики</label>
    <input class="s-lyric" />
    <label>Что в кадре (по-русски)</label>
    <input class="s-note" />
    <label>Промпт картинки (для генерации изображения)</label>
    <textarea class="s-image" rows="3"></textarea>
    <label>Промпт анимации кадра</label>
    <textarea class="s-motion" rows="3"></textarea>
    <button class="s-save">Сохранить кадр</button>

    <label>Промпт последнего кадра сцены</label>
    <textarea class="s-motion-last" rows="3"></textarea>

    <div class="media-row three">
      <div class="media-col">
        <div class="media-head">
          <span>Первый кадр</span>
          <span class="s-image-status status"></span>
        </div>
        <div class="media-box">
          <img class="s-image-preview hidden" />
        </div>
      </div>
      <div class="media-col">
        <div class="media-head"><span>Последний кадр</span></div>
        <div class="media-box">
          <img class="s-image-last-preview hidden" />
        </div>
      </div>
      <div class="media-col">
        <div class="media-head">
          <span>Видео сцены</span>
          <span class="s-video-status status"></span>
        </div>
        <div class="media-box">
          <video class="s-video-preview hidden" controls loop></video>
        </div>
      </div>
    </div>

    <div class="row">
      <button class="s-gen-frames">Сгенерировать кадры (4К)</button>
      <select class="s-provider"></select>
      <button class="s-gen-video primary">Сгенерировать видео сцены</button>
      <label class="approve-check">
        <input type="checkbox" class="s-approve" />
        Утвердить → в общий клип
      </label>
    </div>
    <div class="scene-audio-row hidden">
      <span class="muted">Отрезок трека под сцену:</span>
      <audio class="s-audio" controls></audio>
    </div>
  </div>
</template>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head">
      <span id="modal-title" class="modal-title"></span>
      <button id="modal-close" class="ghost modal-close" title="закрыть">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="/app.js?v=19"></script>
</body>
</html>
