<script>
/* Мини-апп Telegram — та же страница, но с другой точкой входа.
   Telegram кладёт параметры запуска во ФРАГМЕНТ адреса (#tgWebAppData=…),
   поэтому детект не стоит ни одного запроса: обычный посетитель сайта не
   тянет ни SDK Telegram, ни tg.js вообще.
   document.write здесь намеренно: SDK обязан выполниться ДО app.js, а он
   лежит в конце <body> без defer — асинхронная вставка не успела бы. */
(function () {
  var inTg = String(location.hash || "").indexOf("tgWebApp") >= 0
    || Boolean(window.TelegramWebviewProxy)
    || Boolean(window.TelegramWebview);
  if (!inTg) return;
  // Класс html.tg ставит уже tg.js — и ТОЛЬКО когда SDK действительно
  // поднялся. Ставить его здесь нельзя: если telegram.org не открылся,
  // страница осталась бы с правилами мини-аппа (лендинг и вход скрыты) и
  // человек увидел бы пустой экран вместо честного сайта.
  document.write('<scr' + 'ipt src="https://telegram.org/js/telegram-web-app.js"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="/tg.js?v=159"></scr' + 'ipt>');
})();
</script>

    <!-- РЕЖИМНАЯ ПАНЕЛЬ — второй ряд шапки, сразу ПОД общей навигацией:
         капсула режима первой (это ответ «чем я снимаю»), за ней проект и
         лента режимов. В верхней строке остаётся только общее: марка,
         разделы, личный блок. -->
    <div class="tb-modeline">
    <div class="tb-project">
      <!-- ТУМБЛЕР РЕЖИМОВ, схлопнутый в капсулу — ПЕРВЫМ в режимной строке.
           id сохранён (его ищет renderProjectBar), клик открывает меню. -->
      <button type="button" id="project-mode" class="mode-badge mode-switch hidden"
              aria-haspopup="dialog" aria-expanded="false"
              data-i18n-title="modes.menu.title"></button>
      <select id="project-select" class="project-select"></select>
      <label id="project-cover" class="cover-slot project-cover" data-i18n-title="top.coverTitle">
        <input id="project-cover-input" type="file" class="hidden" accept="image/jpeg,image/png,image/webp" />
        <img id="project-cover-img" class="hidden" alt="" />
        <span class="cover-ph"></span>
      </label>
      <input id="project-name" class="project-name" data-i18n-ph="top.projectNamePh" />
      <!-- Навигация по этапам активного трека — закреплена в этой панели. -->
      <div id="stage-jump" class="stage-jump"></div>
      <!-- Вид проекта (альбом/сингл) остаётся в DOM: на него пишет
           renderProjectBar, а $("#…") в app.js — голый querySelector без
           проверок. В шапке он скрыт стилем: то же самое написано в карточке
           режима, а место в строке нужно тумблеру. -->
      <span id="project-kind" class="kind-badge"></span>
      <!-- Копия проекта. Стоит рядом с «новым проектом» намеренно: копия —
           это тоже способ завести проект, только начиная не с нуля. -->
      <button type="button" id="copy-project-btn" class="tb-copy ghost"
              data-i18n-title="copy.projectTitle">⧉</button>
      <button id="new-project-btn" class="tb-new" data-i18n="top.newProject"></button>
    </div>
    <!-- Лента режимов. Стоит между проектом и правым краем: тумблер отвечает
         на вопрос «чем я снимаю», а не «в каком я проекте». Наполняет
         mode-menu.js из общего реестра modes.js. -->
    <div id="mode-seg" class="mode-seg" role="tablist" data-i18n-aria="modes.menu.title"></div>
    </div>
    <div class="tb-user">
      <!-- Тема: система / светлая / тёмная. Атрибут ставится на <html>,
           палитра целиком на токенах — стиль и огонь одинаковы в обеих. -->
      <div class="theme-switch" role="group" aria-label="Тема">
        <button type="button" data-theme-set="system" title="как в системе">🖥</button>
        <button type="button" data-theme-set="light" title="светлая">☀️</button>
        <button type="button" data-theme-set="dark" title="тёмная">🌙</button>
      </div>
      <div class="lang-switch" role="group" data-i18n-aria="lang.aria" data-i18n-title="lang.switchTitle">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
      <span id="points-badge" class="kind-badge points-badge hidden" data-i18n-title="top.pointsTitle"></span>
      <button id="chat-btn" class="account-btn" data-i18n-title="top.chatTitle" data-i18n="top.chat"></button>
      <!-- Музыка — соседний вход, а не пункт внутри студии: там другой объект
           (релиз), другой конвейер и свои состояния. Тот же ярус, что и чат. -->
      <button id="music-btn" class="account-btn" data-i18n-title="top.musicTitle" data-i18n="top.music"></button>
      <!-- «Профиль» с круглой авой из Telegram: img заполняет renderUserBar
           из /api/me (avatar_url), запасной вариант — кружок с первой буквой.
           data-i18n стоит на ВНУТРЕННЕМ span: подпись на самой кнопке
           затирала бы аву при каждой смене языка. -->
      <button id="account-btn" class="account-btn profile-btn hidden" data-i18n-title="top.accountTitle">
        <span class="profile-ava" aria-hidden="true"><img class="profile-ava-img hidden" alt="" /><span class="profile-ava-ini"></span></span>
        <span class="profile-cap" data-i18n="top.account"></span>
      </button>
      <!-- Вход в админку. Отдельная страница, а не вкладка кабинета: CRM,
           рассылка, выплаты и редактор стилей — работа над сервисом, а не
           над клипом. Видна только владельцу (is_admin). -->
      <button id="admin-btn" class="account-btn admin-gear hidden" data-i18n-title="top.adminTitle">⚙</button>
      <button id="save-account-btn" class="hidden" data-i18n="top.saveAccount"></button>
      <button id="logout-btn" class="ghost" data-i18n="top.logout"></button>
    </div>
  </header>

  <!-- Онбординг «первый клип»: липкая плитка на четыре пункта. Живёт до
       первого собранного клипа и после него исчезает — чеклист, который
       висит вечно, перестают читать. Данные — GET /api/onboarding, там же
       честный прогноз списания. -->
  <section id="onboarding" class="panel onboarding hidden"></section>

  <!-- Отдельная студия режима «Мокапы»: hero + промпт-бар + витрина +
       галерея генераций. Наполняет app.js (renderMockupStudio). -->
  <section id="mockup-studio" class="panel hidden">
    <div class="mkp-hero">
      <h2 data-i18n="mkp.heroTitle"></h2>
      <p class="muted" data-i18n="mkp.heroLead"></p>
    </div>
    <input type="file" class="ms-photo-input hidden" accept="image/jpeg,image/png,image/webp" multiple />
    <div class="mk-studio"></div>
    <h2 class="mkp-gal-title" data-i18n="mkp.gallery"></h2>
    <div id="mkp-gallery" class="mkp-gallery"></div>
  </section>

  <section id="story-panel" class="panel">
    <h2 data-i18n="story.title"></h2>
    <label data-i18n-title="story.bibleTitle" data-i18n="story.bible"></label>
    <textarea id="character-bible" rows="2" data-i18n-ph="story.biblePh"></textarea>

    <label data-i18n="story.arc"></label>
    <textarea id="story" rows="3" data-i18n-ph="story.arcPh"></textarea>

    <div class="row">
      <button id="save-project-btn" data-i18n="common.save"></button>
      <button id="gen-story-btn" class="primary" data-i18n="story.gen"></button>
      <span id="story-status" class="status"></span>
    </div>
  </section>

  <!-- ─────────────────────────────────────────────────────────────────────
       СЦЕНАРНЫЕ ДОКУМЕНТЫ — сезонный слой сериала и персона блогера.
       Панель существует только в режимах series и ugc; у клипа её место
       занимает панель сюжета выше. Содержимое рисует app.js из project.docs,
       которые едут вместе с проектом и поллятся тем же циклом.
       ───────────────────────────────────────────────────────────────────── -->
  <section id="docs-panel" class="panel hidden">
    <h2 id="docs-title"></h2>
    <p id="docs-lead" class="docs-lead muted"></p>
    <div class="docs-form">
      <div class="docs-idea">
        <label data-i18n="docs.ideaLabel"></label>
        <input id="docs-idea" data-i18n-ph="docs.ideaPh" />
      </div>
      <div class="docs-eps hidden" id="docs-eps-wrap">
        <label data-i18n="docs.episodesLabel"></label>
        <input id="docs-eps" type="number" min="2" max="24" value="8" />
      </div>
      <button id="docs-gen-bible" class="primary"></button>
      <button id="docs-gen-sheet" class="hidden"></button>
      <button id="docs-make-eps" class="hidden"></button>
      <span id="docs-status" class="status"></span>
    </div>
    <div id="docs-grid" class="docs-grid"></div>
  </section>

  <section id="chars-panel" class="panel">
    <h2 data-i18n-title="chars.titleHint" data-i18n="chars.title"></h2>
    <!-- Персонажи листаются вправо той же лентой, что и сцены (bindStrip):
         на панели живёт компактная визитка, полное досье — в модалке. -->
    <div class="strip-wrap chars-wrap">
      <button class="strip-arrow strip-prev" type="button" data-i18n-aria="common.prev">‹</button>
      <div id="characters" class="scenes chars-strip"></div>
      <button class="strip-arrow strip-next" type="button" data-i18n-aria="common.next">›</button>
    </div>
    <!-- Кнопка осталась как обработчик, но скрыта: видимый вход — карточка
         с плюсом в конце ленты персонажей (рисует app.js). -->
    <button id="add-character-btn" class="hidden" data-i18n="chars.add"></button>
  </section>

  <section id="tracks-panel" class="panel">
    <h2 id="tracks-title" data-i18n="tracks.title"></h2>
    <div id="tracks"></div>
  </section>

  <!-- «Добавить» — СВОЙ блок под лентой, а не форма внутри панели объектов.
       Раньше она жила там же, где карточки, и была видна всегда — включая
       сингл, где второй трек создать нельзя в принципе. Теперь блок целиком
       прячется, когда добавлять нечего. -->
  <section id="add-track-panel" class="panel add-track-panel">
    <details class="add-track">
      <summary data-i18n="tracks.add"></summary>
      <form id="add-track-form" class="track-form">
        <input name="title" data-i18n-ph="tracks.titlePh" required />
        <label data-i18n="tracks.styleLabel"></label>
        <div class="style-picker"></div>
        <input type="hidden" name="style_keys" />
        <!-- Каркас объекта (формат UGC / жанр сериала). У клипа скрыт: там
             каркас выбирается на витрине промтов вместе со стилем. -->
        <div id="add-format-wrap" class="hidden">
          <label data-i18n="docs.formatLabel"></label>
          <select name="format_key" id="add-format"></select>
        </div>
        <textarea name="lyrics" data-i18n-ph="tracks.lyricsPh" rows="4"></textarea>
        <textarea name="comment" data-i18n-ph="tracks.commentPh" rows="3"></textarea>
        <input name="audio" type="file" accept="audio/*" />
        <button type="submit" class="primary" data-i18n="tracks.submit"></button>
      </form>
    </details>
  </section>
</div>

<!-- ─────────────────────────────────────────────────────────────────────────
     ЧАТ — третий экран рядом с лендингом (#welcome) и студией (#app).
     ОДНО окно: переключатель модели живёт ВНУТРИ строки ввода, а не отдельной
     панелью и не вкладками «Чат / Картинки / Видео». Выбранная модель и есть
     намерение: текст, картинка или видео из картинки.
     Ленту, сайдбар и селектор рисует app.js — разметка держит только каркас.
     ───────────────────────────────────────────────────────────────────── -->
<div id="chat" class="chat mk hidden">
  <!-- ЛЕВО: история и проекты. Две вкладки — «Ленты» (то, что сделано в этом
       окне) и «Проекты» (настоящие Project.kind, вход в специальные режимы).
       Третьей сущности «папка для лент» здесь нет намеренно: она породила бы
       вторую студию рядом с настоящей. -->
  <aside id="chat-side" class="chat-side">
    <div class="chat-side-head">
      <button id="chat-to-studio" class="ghost chat-back" data-i18n="chat.toStudio"></button>
      <div class="lang-switch" role="group" data-i18n-aria="lang.aria" data-i18n-title="lang.switchTitle">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
    </div>
    <div id="mk-tabs" class="mk-tabs" role="tablist"></div>
    <button id="chat-new" class="primary chat-new" data-i18n="chat.new"></button>
    <input id="chat-search" class="chat-search" data-i18n-ph="chat.searchPh" />
    <div id="chat-list" class="chat-list"></div>
    <div id="mk-projects" class="mk-projects hidden"></div>
    <!-- БАНК ГЕНЕРАЦИЙ: всё, что человек когда-либо сделал — кадры, видео,
         обложки — одной лентой. Раньше найти вчерашний кадр можно было
         только вспомнив, в каком проекте он лежал. -->
    <div id="mk-bank" class="mk-bank hidden"></div>
    <div class="mk-side-foot">
      <p id="chat-retention" class="chat-retention muted"></p>
      <p id="mk-storage" class="chat-retention muted"></p>
    </div>
  </aside>

  <!-- ЦЕНТР: карточка выбранной модели до первого запуска, дальше — лента
       результатов. Пустое поле в экономике, где нажатие стоит от 0 до 252
       токенов, — это лотерея; карточка отвечает на «умеет / не умеет / что
       нужно на входе / сколько стоит» ДО нажатия. -->
  <main class="chat-main">
    <header class="chat-head">
      <button id="chat-side-toggle" class="ghost chat-side-toggle" aria-label="menu">☰</button>
      <button id="mk-back-scene" class="ghost mk-back-scene hidden"></button>
      <span id="chat-head-title" class="chat-head-title"></span>
      <span id="chat-points" class="kind-badge points-badge" data-i18n-title="top.pointsTitle"></span>
    </header>

    <div id="chat-feed" class="chat-feed"></div>

    <div class="chat-compose">
      <!-- Расход этого разговора виден прямо над полем: человек не должен
           уходить в кабинет, чтобы понять, во что ему обходится работа. -->
      <div class="cc-meter"><span id="cc-meter"></span></div>
      <!-- Ассистент песочницы: видит состояние проекта и предлагает следующий
           шаг кнопками. Ничего не запускает сам — тратить чужие токены без
           нажатия он не должен. -->
      <div id="cc-agent" class="cc-agent hidden">
        <p id="cc-agent-reply" class="cc-agent-reply"></p>
        <div id="cc-agent-acts" class="cc-agent-acts"></div>
      </div>
      <div id="cc-source" class="cc-source hidden"></div>
      <div id="cc-files" class="cc-files"></div>
      <div class="cc-field">
        <textarea id="cc-text" rows="2" data-i18n-ph="chat.inputPh"></textarea>
        <!-- Счётчик появляется с 80 % лимита. Постоянный «0/5000» — шум в
             99 % случаев, а лимит у нас настоящий: раз режем на сервере,
             обязаны написать где. -->
        <span id="mk-count" class="mk-count hidden"></span>
      </div>
      <!-- Ошибка живёт ПОД ПОЛЕМ, а не в alert: в окне, где одно нажатие
           стоит 252 токена, модальное окно поверх работы особенно неуместно. -->
      <p id="mk-error" class="mk-error hidden"></p>
      <p id="mk-enhanced" class="mk-enhanced hidden"></p>
      <!-- Порядок контролов = порядок работы: что прикладываю → чем делаю →
           как → сколько стоит → пуск. -->
      <div class="cc-bar">
        <label class="cc-attach" data-i18n-title="chat.attachTitle">
          <input id="cc-file" type="file" class="hidden" accept="image/jpeg,image/png,image/webp" multiple />
          <span>+</span>
        </label>
        <select id="cc-model" class="cc-model"></select>
        <button type="button" id="mk-aspect-btn" class="mk-mini hidden"></button>
        <!-- Длительность держится селектом как СОСТОЯНИЕМ (её читает отправка),
             а видимый контрол — чипы с ценой в правой панели: варианты,
             различающиеся ценой, обязаны быть видны целиком. -->
        <select id="cc-duration" class="cc-duration hidden"></select>
        <button type="button" id="mk-dur-btn" class="mk-mini hidden"></button>
        <button type="button" id="mk-lib" class="ghost mk-mini"></button>
        <button type="button" id="mk-enhance" class="ghost mk-mini"></button>
        <button type="button" id="mk-params" class="ghost mk-mini" aria-controls="mk-panel"></button>
        <span id="cc-price" class="cc-price"></span>
        <button id="cc-send" type="button" class="primary cc-send"></button>
      </div>
      <p class="cc-note muted" id="cc-note"></p>
    </div>
  </main>

  <!-- ПРАВО: параметры сверху вниз В ПОРЯДКЕ ВЛИЯНИЯ НА ЦЕНУ. «Сбросить» у
       группы появляется, только когда есть что сбрасывать: пять всегда
       мёртвых кнопок сброса — те же пять контролов, которые ничего не делают. -->
  <aside id="mk-panel" class="mk-panel">
    <div id="mk-groups" class="mk-groups"></div>
    <div class="mk-panel-foot">
      <button type="button" id="mk-reset-all" class="ghost hidden"></button>
      <button type="button" id="mk-hide" class="ghost"></button>
    </div>
  </aside>
</div>

<!-- ═══════════════════════════ РАЗДЕЛ «МУЗЫКА» ═══════════════════════════
     Свой экран, как у чата: hideScreens() гасит все разом, показывает один.
     Внутри — только каркас, всё содержимое рисует music-studio.js, потому
     что оно зависит от того, что реально включено на сервере (ключ генерации,
     движки мастеринга, служба публикации). Рисовать разметкой то, чего может
     не быть, значит показывать кнопки, которые молча ничего не делают. -->
<div id="music" class="mus hidden">
  <header class="mus-top">
    <div class="mus-bar">
      <button id="mus-back" type="button" class="ghost" data-i18n="mus.nav.back"></button>
      <span class="mus-word">qlol<b>music</b></span>
      <span id="mus-count" class="mus-count"></span>
      <span id="mus-points" class="kind-badge points-badge hidden" data-i18n-title="top.pointsTitle"></span>
      <div class="lang-switch" role="group" data-i18n-aria="lang.aria" data-i18n-title="lang.switchTitle">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
    </div>
  </header>

  <div class="mus-wrap">
    <!-- Приём материала: своё окно загрузки и генерация — две равные двери. -->
    <div id="mus-intake" class="mus-row">
      <label id="mus-drop" class="mus-drop">
        <input id="mus-file" type="file" class="hidden"
               accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus,.aif,.aiff" />
        <span class="mus-drop-ico">♪</span>
        <span id="mus-drop-title" class="mus-drop-title" data-i18n-html="mus.drop.titleHtml"></span>
        <span id="mus-drop-hint" class="mus-drop-hint"></span>
        <span id="mus-drop-prog" class="mus-prog hidden"><i></i></span>
        <span id="mus-drop-err" class="mus-drop-err hidden"></span>
      </label>

      <div id="mus-gen" class="mus-card">
        <h3 data-i18n="mus.gen.title"></h3>
        <p class="mus-sub" data-i18n="mus.gen.sub"></p>
        <textarea id="mus-gen-prompt" rows="3" data-i18n-ph="mus.gen.ph"></textarea>
        <div class="mus-gen-row">
          <select id="mus-gen-secs"></select>
          <label class="mus-match">
            <input id="mus-gen-instr" type="checkbox" />
            <span data-i18n="mus.gen.instr"></span>
          </label>
          <span id="mus-gen-price" class="mus-price"></span>
          <button id="mus-gen-run" type="button" class="primary"></button>
        </div>
        <div id="mus-gen-off" class="mus-off hidden"></div>
      </div>
    </div>

    <div id="mus-list-card" class="mus-card">
      <h3 data-i18n="mus.list.title"></h3>
      <div id="mus-list" class="mus-list"></div>
    </div>

    <!-- Карточка трека. Пустая до открытия: рисуется целиком из данных. -->
    <div id="mus-detail" class="hidden"></div>
  </div>

  <!-- Эталон «хочу звучать как это» лежит вне карточки: карточка
       перерисовывается на каждый тик опроса, и input внутри неё терял бы
       выбранный файл. -->
  <input id="mus-ref-file" type="file" class="hidden"
         accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus,.aif,.aiff" />
</div>

<template id="track-tpl">
  <div class="track-card">
    <div class="track-head">
      <label class="cover-slot track-cover" data-i18n-title="track.coverTitle">
        <input type="file" class="t-cover-input hidden" accept="image/jpeg,image/png,image/webp" />
        <img class="t-cover-img hidden" alt="" loading="lazy" decoding="async" />
        <span class="cover-ph"></span>
      </label>
      <span class="pos"></span>
      <input class="t-title" data-i18n-ph="track.titlePh" />
      <!-- Этапы стоят в одной строке с названием: отдельной строкой они
           съедали высоту, а название растягивалось на весь экран впустую.
           НЕ ВЫНОСИТЬ обратно — владелец просил дважды. -->
      <div class="stage-tabs"></div>
      <button class="s-supergen primary" data-i18n-title="track.supergenTitle" data-i18n="track.supergen"></button>
      <div class="order-btns">
        <button class="up ghost" data-i18n-title="common.moveUp">↑</button>
        <button class="down ghost" data-i18n-title="common.moveDown">↓</button>
        <button class="t-copy ghost" data-i18n-title="copy.trackTitle">⧉</button>
        <button class="del ghost danger" data-i18n-title="track.delTitle">✕</button>
      </div>
    </div>
    <span class="supergen-note status"></span>

    <div class="stage-panes">
      <!-- 1. Настройка -->
      <!-- ЕДИНЫЙ БЛОК ПАРАМЕТРОВ РЕЖИМА.
           Раньше настройки объекта лежали в пяти разных местах: стиль здесь,
           «зерно» и «без сюжета» — чекбоксами под плеером, сюжет — отдельной
           панелью шага 1, движки — своей коробкой, а сюжетный КАРКАС был
           доступен вообще только на лендинге и в студию не попадал никогда.
           Здесь всё это стоит в одном блоке и в порядке принятия решений:
           что снимаем → как выглядит → кадр → чем и почём → материал.

           Порядок продиктован данными, а не вкусом: у каждого каркаса есть
           styles_fit, то есть каркас подсказывает стиль, а не наоборот.

           Секции 1, 2 и 4 открыты всегда — это два решения человека и цена.
           3 и 5 схлопнуты: их состояние держит app.js в модуле, а не в DOM,
           потому что #tracks перерисовывается поллингом целиком. -->
      <section class="stage-pane" data-stage="setup">
        <div class="mode-setup">
          <div class="ms-summary"></div>

          <!-- 1. ЧТО СНИМАЕМ -->
          <section class="ms-sec" data-sec="what">
            <h4 class="ms-h" data-i18n="modeSetup.what"></h4>
            <p class="ms-hint muted"></p>
            <!-- Витрина каркасов убрана по просьбе владельца: тринадцать
                 карточек с описаниями занимали экран и мешали работе.
                 Каркасы никуда не делись — они живут на лендинге и в каталоге
                 промтов, а настоящее состояние держит .t-format ниже.
                 Узел оставлен пустым и скрытым: на нём висит рендер, и его
                 удаление уронило бы renderModeSetup. -->
            <div class="ms-presets hidden"></div>
            <!-- ТЕКСТОВАЯ МОДЕЛЬ. Стоит здесь, а не в блоке движков, потому
                 что это решение о СЦЕНАРИИ: кто пишет сюжет, библию и
                 раскадровку. Движки ниже отвечают за картинку и видео —
                 другой вопрос и другой кошелёк.
                 Позиции без ключа сюда не приезжают вовсе (продавать то,
                 чего нет, нельзя), закрытые тарифом приезжают с замком. -->
            <div class="ms-row ms-text-models">
              <label data-i18n="textModel.label"></label>
              <div class="t-text-models eng-tabs"></div>
              <p class="ms-text-note muted"></p>
            </div>
            <!-- Сюжет проекта. Это ЗЕРКАЛО #story, а не переезд: панель сюжета
                 живёт вне #tracks, а #tracks поллинг перерисовывает целиком —
                 перенесённый сюда узел был бы уничтожен первой же
                 перерисовкой, и весь app.js упал бы на $("#story").value.
                 Показывается ровно у одного объекта: сюжет общий на проект. -->
            <div class="ms-story hidden">
              <label data-i18n="modeSetup.storyLabel"></label>
              <textarea class="ms-story-text" rows="3" data-i18n-ph="story.arcPh"></textarea>
              <div class="row">
                <button type="button" class="ms-story-save" data-i18n="common.save"></button>
                <button type="button" class="ms-story-gen primary" data-i18n="story.gen"></button>
                <span class="ms-story-status status"></span>
              </div>
            </div>
            <!-- «Без сюжета» — это ВЫБОР ТИПА СЮЖЕТА, а не свойство плеера.
                 До этого чекбокс стоял под аудио, рядом с зерном плёнки. -->
            <label class="approve-check grain-check t-nostory-wrap" data-i18n-title="track.nostoryTitle"><input type="checkbox" class="t-nostory" /> <span data-i18n="track.nostory"></span></label>
            <label class="approve-check grain-check" data-i18n-title="track.randomCastTitle"><input type="checkbox" class="t-randomcast" /> <span data-i18n="track.randomCast"></span></label>
            <button type="button" class="t-shuffle-cast ghost hidden" data-i18n="track.shuffleCast"></button>

            <!-- Поля режимов «сериалы», «UGC» и «мокапы». В клипе скрыты. -->
            <div class="t-mode-fields hidden">
              <div class="row t-mode-row">
                <div class="t-format-wrap">
                  <label data-i18n="docs.formatLabel"></label>
                  <select class="t-format"></select>
                </div>
                <div class="t-season-wrap hidden">
                  <label data-i18n="docs.seasonLabel"></label>
                  <input class="t-season" type="number" min="0" max="99" />
                </div>
                <div class="t-episode-wrap hidden">
                  <label data-i18n="docs.episodeLabel"></label>
                  <input class="t-episode" type="number" min="0" max="999" />
                </div>
              </div>
              <div class="t-location-wrap hidden">
                <label data-i18n="docs.locationLabel"></label>
                <textarea class="t-location" rows="2" data-i18n-ph="docs.locationPh"></textarea>
              </div>
              <div class="t-script-wrap hidden">
                <div class="row">
                  <button class="t-gen-script primary"></button>
                  <span class="t-script-status status"></span>
                </div>
                <div class="t-script-body doc-body muted"></div>
              </div>
            </div>
          </section>

          <!-- 2. КАК ВЫГЛЯДИТ -->
          <section class="ms-sec" data-sec="look">
            <h4 class="ms-h" data-i18n="modeSetup.look"></h4>
            <label class="ms-style-label" data-i18n-title="track.styleLabelTitle" data-i18n="track.styleLabel"></label>
            <div class="t-style-picker style-picker style-picker-wide"></div>
            <input type="hidden" class="t-style" />
            <!-- ПЕРЕРИСОВАТЬ В НОВОМ СТИЛЕ. Появляется ровно тогда, когда у
                 объекта уже есть кадры, а стиль сменили: раньше смена чипов
                 не давала никакого следующего действия, и человек честно
                 видел «поставил другой стиль — картинки те же».
                 Цена и потери показываются ДО нажатия. -->
            <div class="ms-restyle hidden">
              <div class="row">
                <button type="button" class="t-restyle primary"></button>
                <span class="t-restyle-status status"></span>
              </div>
              <p class="t-restyle-warn muted"></p>
            </div>
          </section>

          <!-- 3. КАДР: геометрия, разрешение, зерно. Схлопнуто у всех, кроме
               мокапов: там квадрат и разрешение — главные параметры съёмки. -->
          <details class="ms-sec ms-fold" data-sec="frame">
            <summary data-i18n="modeSetup.frame"></summary>
            <div class="ms-fold-body">
              <div class="ms-row">
                <label data-i18n="modeSetup.aspect"></label>
                <div class="ms-aspect eng-tabs"></div>
              </div>
              <div class="ms-row ms-res-row">
                <label data-i18n="modeSetup.resolution"></label>
                <div class="ms-res eng-tabs"></div>
              </div>
              <label class="approve-check grain-check" data-i18n-title="track.grainTitle"><input type="checkbox" class="t-grain" /> <span data-i18n="track.grain"></span></label>
              <p class="ms-frame-note muted"></p>
            </div>
          </details>

          <!-- 4. ДВИЖКИ И ЦЕНА: один выбор на весь объект, табами.
               Движков восемь, и цена сцены у них отличается в тридцать раз —
               выбор такого веса обязан быть виден целиком. -->
          <section class="ms-sec" data-sec="engines">
            <h4 class="ms-h" data-i18n="modeSetup.engines"></h4>
            <div class="t-engines">
              <div class="t-engines-head">
                <b data-i18n="engines.title"></b>
                <span class="eng-hint"></span>
              </div>
              <div class="eng-row">
                <label data-i18n="engines.image"></label>
                <div class="t-img-engines eng-tabs"></div>
              </div>
              <div class="eng-row">
                <label data-i18n="engines.video"></label>
                <div class="t-vid-engines eng-tabs"></div>
              </div>
              <div class="eng-forecast"></div>
            </div>
          </section>

          <!-- 5. МАТЕРИАЛ: то, что человек приносит сам. У клипа дорожка и
               текст песни, у ролика локация, у мокапа фото упаковки. -->
          <details class="ms-sec ms-fold" data-sec="material">
            <summary data-i18n="modeSetup.material"></summary>
            <div class="ms-fold-body">
              <!-- Фото товара (мокапы): референс, по которому упаковка обязана
                   совпасть до последней буквы на этикетке. -->
              <div class="ms-photos hidden">
                <label data-i18n="modeSetup.photos"></label>
                <p class="ms-photos-hint muted" data-i18n="modeSetup.photosHint"></p>
                <div class="ms-photos-grid"></div>
                <label class="ms-photo-add">
                  <input type="file" class="ms-photo-input hidden" accept="image/jpeg,image/png,image/webp" multiple />
                  <span data-i18n="modeSetup.photosAdd"></span>
                </label>
                <span class="ms-photos-status status"></span>
                <!-- 3D-облёт: 8 ракурсов по кругу, листаются drag'ом. -->
                <div class="ms-turnaround">
                  <button type="button" class="ms-ta-btn ghost"></button>
                  <span class="ta-status status"></span>
                  <div class="ms-ta-viewer hidden"></div>
                </div>
                <!-- Маркетинг-студия: промпт-бар + витрина шаблонов.
                     Наполняется из app.js (msMarketingStudio). -->
                <div class="mk-studio hidden"></div>
              </div>
              <div class="track-body">
                <div class="track-left">
                  <!-- Аудио — свойство КЛИПА: серия и ролик режутся не по
                       дорожке, а по сценарию. Скрывает renderTrack по
                       mode.needs_audio. -->
                  <label class="t-audio-label" data-i18n="track.audio"></label>
                  <!-- Свой плеер: форма волны с границами кадров прямо на
                       ней, перемотка щелчком, эквалайзер и нарезка. Тег audio
                       остаётся движком звука, но спрятан — родные контролы
                       браузера не умеют ни того, ни другого. -->
                  <audio class="t-audio hidden" preload="metadata"></audio>
                  <div class="wp hidden">
                    <div class="wp-row">
                      <button type="button" class="wp-play ghost">▶</button>
                      <span class="wp-clock"></span>
                      <span class="wp-spacer"></span>
                      <button type="button" class="wp-eq-btn ghost" data-i18n="wave.eq"></button>
                      <button type="button" class="wp-cut ghost hidden" data-i18n="wave.cut"></button>
                      <button type="button" class="wp-clear ghost hidden" data-i18n="wave.clear"></button>
                    </div>
                    <canvas class="wp-wave" height="96"></canvas>
                    <div class="wp-eq hidden">
                      <label><span data-i18n="wave.low"></span>
                        <input type="range" class="wp-eq-low" min="-12" max="12" step="1" value="0" /></label>
                      <label><span data-i18n="wave.mid"></span>
                        <input type="range" class="wp-eq-mid" min="-12" max="12" step="1" value="0" /></label>
                      <label><span data-i18n="wave.high"></span>
                        <input type="range" class="wp-eq-high" min="-12" max="12" step="1" value="0" /></label>
                      <button type="button" class="wp-eq-reset ghost" data-i18n="wave.flat"></button>
                    </div>
                    <span class="wp-hint muted" data-i18n="wave.hint"></span>
                  </div>
                  <!-- Работа с файлом дорожки в одну строку: длительность,
                       загрузка нового файла и выгрузка нынешнего. Загрузка
                       была спрятана в неприметную ссылку — её просто не
                       находили, а заменить дорожку без неё нельзя. -->
                  <div class="t-audio-acts">
                    <span class="t-duration"></span>
                    <label class="t-audio-swap btn">
                      <span data-i18n="track.audioSwap"></span>
                      <input type="file" accept="audio/*" hidden />
                    </label>
                    <a class="t-audio-get btn ghost hidden" download
                       data-i18n="track.audioGet"></a>
                    <button type="button" class="t-audio-url btn ghost"
                            data-i18n="track.audioUrl"></button>
                  </div>
                  <!-- Импорт по ПРЯМОЙ ссылке на файл: облако, сайт битмейкера,
                       выгрузка дистрибьютора. Ссылки на ролики и стриминг
                       сервер отбивает — оттуда звук достаётся только в обход
                       правил площадки. -->
                  <div class="t-url-row hidden">
                    <input class="t-url-input" type="url"
                           data-i18n-ph="track.audioUrlPh" />
                    <button type="button" class="t-url-go primary"
                            data-i18n="track.audioUrlGo"></button>
                  </div>
                  <p class="t-url-hint muted hidden" data-i18n="track.audioUrlHint"></p>
                  <!-- Текст песни — в ЛЕВОЙ колонке под дорожкой: ему нужна
                       высота, и на десктопе он стоит рядом с компактными
                       комментарием и библией, а не этажом ниже во всю ширину.
                       app.js ищет поля по классам — переезд безопасен. -->
                  <label class="t-lyrics-label" data-i18n="track.lyrics"></label>
                  <textarea class="t-lyrics" rows="10" data-i18n-ph="track.lyricsPh"></textarea>
                </div>
                <div class="track-right">
                  <label data-i18n="track.comment"></label>
                  <textarea class="t-comment" rows="4" data-i18n-ph="track.commentPh"></textarea>
                  <!-- Библия героя — зеркало проектного поля (узел живёт вне
                       #tracks); компактно в правой колонке под комментарием. -->
                  <div class="ms-bible hidden">
                    <label data-i18n-title="story.bibleTitle" data-i18n="story.bible"></label>
                    <textarea class="ms-bible-text" rows="3" data-i18n-ph="story.biblePh"></textarea>
                  </div>
                  <!-- Режиссёрская заметка трека: её пишет генератор сюжета.
                       СВЁРНУТА: читают её один раз, а место она занимала
                       постоянно и отжимала дорожку. Данные на месте. -->
                  <details class="t-note-view hidden">
                    <summary data-i18n="track.noteLabel"></summary>
                    <p class="t-note-text muted"></p>
                  </details>
                </div>
              </div>
            </div>
          </details>

          <div class="row ms-foot">
            <button class="save-track" data-i18n="track.saveTrack"></button>
          </div>
        </div>
      </section>

      <!-- 2. Раскадровка -->
      <section class="stage-pane" data-stage="board">
        <!-- ОДНА панель действий раскадровки. Раньше «Сгенерировать раскадровку»
             стояла сверху, а кнопки листа — колонкой сбоку от миниатюры: три
             похожих действия в трёх разных местах, и человек искал, куда жать.
             Порядок здесь = порядок работы: сцены → лист → посмотреть → разложить. -->
        <div class="board-bar">
          <button class="gen-scenes primary" data-i18n="track.genScenes"></button>
          <button class="gen-storyboard" data-i18n="track.genSheet"></button>
          <button class="sb-open ghost" data-i18n-title="track.sheetOpenTitle" data-i18n="track.sheetOpen"></button>
          <button class="slice-storyboard ghost" data-i18n-title="track.sliceTitle" data-i18n="track.sliceSheet"></button>
          <!-- Нарезка под бит: границы сцен едут к ближайшим сильным долям.
               Бесплатно — счёт на своём CPU, без токенов. -->
          <button class="beat-align ghost" data-i18n-title="track.beatAlignTitle" data-i18n="track.beatAlign"></button>
          <!-- Покрытие дорожки: мелкая подпись + кнопка «дописать» ЖИВУТ В ЭТОЙ
               ЖЕ строке — отдельная плашка на всю ширину съедала вертикаль. -->
          <span class="scenes-coverage hidden"></span>
          <span class="scenes-status status"></span>
          <span class="sb-status status"></span>
        </div>
        <!-- Лист раскадровки — контрольный отпечаток, а не полотно на всю
             страницу: миниатюра фиксированной высоты, клик открывает крупно. -->
        <div class="storyboard-block">
          <div class="media-head">
            <span data-i18n="track.sheetTitle"></span>
          </div>
          <div class="storyboard-row">
            <div class="storyboard-box">
              <img class="sb-preview hidden" alt="" loading="lazy" decoding="async" />
              <span class="sb-empty muted" data-i18n="track.sheetEmpty"></span>
            </div>
            <!-- Вертикальный лист стоит слева, а его сводка — рядом, а не
                 под пустым полем: сетка, число кадров, подсказка «клик — крупно». -->
            <div class="storyboard-side hidden">
              <span class="sb-meta sb-grid-note"></span>
              <span class="sb-meta muted" data-i18n="track.sheetZoomHint"></span>
              <!-- Свободная сцена живёт рядом с листом: пустое поле справа от
                   вертикального листа — её законное место, а не этаж ниже. -->
              <div class="cine-bar hidden"></div>
            </div>
          </div>
          <!-- Лист нарисован под другое число кадров: резать его нельзя,
               куски поедут мимо панелей. Говорим об этом у самого листа. -->
          <p class="sb-stale warn hidden"></p>
        </div>
        <!-- Кадры идут лентой: под музыку с подсветкой текущего кадра
             горизонтальная прокрутка удобнее, а переключатель вида владелец
             просил убрать. -->
        <div class="scenes-toolbar">
          <span class="scenes-count muted"></span>
        </div>
        <!-- Cinema-бар: свободная сцена одним промптом, @ зовёт персонажа. -->
        <div class="cine-bar hidden"></div>
        <div class="strip-wrap">
          <button class="strip-arrow strip-prev" type="button" data-i18n-aria="common.prev">‹</button>
          <div class="scenes scenes-board"></div>
          <button class="strip-arrow strip-next" type="button" data-i18n-aria="common.next">›</button>
        </div>
        <button type="button" class="scenes-more ghost hidden"></button>
        <div class="row">
          <button class="add-scene" data-i18n="track.addScene"></button>
          <button class="gen-all-frames primary" data-i18n="track.allFrames"></button>
          <button class="gen-all-videos primary" data-i18n-title="track.allVideosTitle" data-i18n="track.allVideos"></button>
          <!-- Перерисовать ВСЁ в нынешнем стиле: то же действие, что кнопка в
               «Как выглядит», но доступное с ленты кадров. -->
          <button class="redraw-frames" data-i18n-title="restyle.redrawTitle" data-i18n="restyle.redraw"></button>
          <span class="all-frames-note muted"></span>
        </div>
      </section>

      <!-- 3. Анимация -->
      <section class="stage-pane" data-stage="anim">
        <!-- «Закрепить ленту»: обе ленты (кадры и готовые видео) листаются
             вместе — под раскадровкой видно её результат. -->
        <label class="approve-check strip-lock" data-i18n-title="track.stripLockTitle">
          <input type="checkbox" class="strip-lock-cb" />
          <span data-i18n="track.stripLock"></span>
        </label>
        <div class="strip-wrap">
          <button class="strip-arrow strip-prev" type="button" data-i18n-aria="common.prev">‹</button>
          <div class="scenes scenes-anim"></div>
          <button class="strip-arrow strip-next" type="button" data-i18n-aria="common.next">›</button>
        </div>
        <button type="button" class="scenes-more anim-more ghost hidden"></button>
        <!-- Прежние версии всех сцен: мелкие миниатюры, клик — крупно в окне. -->
        <details class="versions-dock hidden">
          <summary class="muted versions-dock-sum"></summary>
          <div class="versions-strip"></div>
        </details>
      </section>
    </div>

    <!-- Готовый клип — не этап, а витрина трека: видна на любом этапе и всегда
         показывает актуальную склейку. Галочка «автосборка» пересобирает клип
         сама, как только у трека появляется новое готовое видео сцены. -->
    <div class="clip-dock">
      <div class="media-head">
        <span class="clip-title" data-i18n="track.clipHead"></span>
        <span class="clip-status status"></span>
      </div>
      <div class="clip-dock-body">
        <div class="media-box clip-box">
          <video class="clip-preview hidden" controls preload="none"></video>
          <span class="clip-empty muted" data-i18n="track.clipEmpty"></span>
        </div>
        <div class="clip-dock-side">
          <label class="approve-check autoasm-label" data-i18n-title="track.autoAsmTitle">
            <input type="checkbox" class="t-autoasm" />
            <span data-i18n="track.autoAsm"></span>
          </label>
          <div class="row">
            <button class="assemble primary" data-i18n="track.assemble"></button>
            <a class="clip-download ghost hidden" download data-i18n="track.download"></a>
          </div>
          <span class="autoasm-note status"></span>
          <details class="final-scenes">
            <summary data-i18n="track.finalScenes"></summary>
            <div class="final-grid"></div>
          </details>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Визитка персонажа в ленте: моделька, имя, «главный», счётчик атрибутов.
     Клик открывает досье (#char-edit-tpl) в общей модалке. -->
<template id="char-tpl">
  <button type="button" class="char-card" data-i18n-title="character.openTitle">
    <span class="cc-thumb">
      <img class="cc-img hidden" alt="" />
      <span class="cc-ph"></span>
    </span>

<!-- Реестр режимов — ПЕРВЫМ и ВСЕГДА: из него читают и классическая шапка
     (app.js + mode-menu.js), и верстак (nav.js, за флагом ?nav=1). Пока
     реестр жил внутри nav.js, тумблер режимов существовал только под флагом,
     то есть владелец в обычной студии его не видел вообще. -->
<script src="/modes.js?v=159"></script>
<script src="/i18n.js?v=159"></script>
<script src="/app.js?v=159"></script>
<!-- Раздел «Музыка». ПОСЛЕ app.js: опирается на его глобали (api, hideScreens,
     showApp, fail) и на словарь i18n.js. -->
<script src="/music-studio.js?v=159"></script>
<!-- Тумблер режимов и меню режима. ПОСЛЕ app.js: он опирается на живой
     #project-select и на window.openNewProjectModal / applyModeShortcut. -->
<script src="/mode-menu.js?v=159"></script>
<!-- ВЕРХНЯЯ НАВИГАЦИЯ ПО РАЗДЕЛАМ. ПОСЛЕ app.js и mode-menu.js: она
     ПЕРЕНОСИТ в свою ленту живые кнопки шапки (#chat-btn, #music-btn,
     #account-btn, #admin-btn) вместе с их обработчиками, поэтому обработчики
     к этому моменту должны быть уже навешаны. -->
<script src="/sections.js?v=159"></script>
<!-- Раздел «Школа»: курсы, модули, уроки, доступ, авторы, кейсы, отзывы.
     ПОСЛЕ sections.js: подсветка раздела и модалка базы знаний живут там. -->
<script src="/school.js?v=159"></script>
<!-- Каталог промтов (четыре слоя и сборка). Отдельным файлом от sections.js:
     лента разделов и каталог живут разной жизнью, и правка одного не должна
     требовать перечитывания другого. -->
<script src="/library.js?v=159"></script>
<script>
/* ВЕРСТАК (nav.css + nav.js) — ЗА ФЛАГОМ, а не по умолчанию.
   Навигация подменяет топбар и переключает панели поверх живого app.js;
   на боевом сервисе такое включают, посмотрев на него своими глазами.
   Флаг: ?nav=1 включает и запоминает, ?nav=0 выключает и забывает.
   Откат — снять флаг, БЕЗ деплоя и без отката кода: для режима, в котором
   владелец смотрит правки прямо на проде, это главное свойство.
   Автозапуск самого nav.js уважает data-nav-manual, поэтому чужие страницы
   (демо nav-preview.html) он не задевает. */
(function () {
  var qs = new URLSearchParams(location.search);
  var flag = qs.get("nav");
  try {
    if (flag === "1") localStorage.setItem("lolq_nav", "1");
    if (flag === "0") localStorage.removeItem("lolq_nav");
  } catch (e) { /* приватный режим */ }
  var on = flag === "1";
  if (!on && flag !== "0") {
    try { on = localStorage.getItem("lolq_nav") === "1"; } catch (e) { on = false; }
  }
  if (!on) return;
  var css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = "/nav.css?v=159";
  document.head.appendChild(css);
  var js = document.createElement("script");
  js.src = "/nav.js?v=159";
  document.body.appendChild(js);
})();
</script>
